<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-container">
        <div class="fb-left">
            <div class="child1">
                <h1>facebook</h1>
                <p>Facebook membantu Anda terhubung dan berbagi dengan orang-orang dalam kehidupan Anda.</p>
            </div>
        </div>
        <div class="fb-right">
            <form class="child1" action="login.html">
                <div class="border-input">
                    <input class="text-box" type="email" placeholder="Email atau Nomor Telepon">
                    <input class="text-box" type="password" placeholder="Kata Sandi">
                    <button class="button" type="submit">Masuk</button>
                    <a class="forgot" href="">lupa kata sandi?</a>
                    <hr>
                    <button class="button2" type="submit" formaction="new.html">Buat akun baru</button> <!-- Formaction overrides the action in the form -->
                </div>
                <label class="bottom-text"><a href="">Buat Halaman</a> untuk selebriti, merek, atau bisnis.</label>
            </form>
        </div>
    </div>
    
</body>
</html>
